# ---- 便利合集 ----

[[ruleset]]
name = "domain/proxy"
type = "domain"
description = "国外常用服务合集（gfw + 精选服务）。路由顺序：domain/gfw → domain/cn → domain/proxy"
union = [
  "domain/gfw",
  "domain/service/google",
  "domain/service/youtube",
  "domain/service/netflix",
  "domain/service/disney",
  "domain/service/spotify",
  "domain/service/telegram",
  "domain/service/twitter",
  "domain/service/ai",
  "domain/service/github",
  "domain/service/steam",
  "domain/service/tiktok",
  "domain/service/meta",
  "domain/service/discord",
  "domain/service/twitch",
  "domain/service/reddit",
  "domain/service/epicgames",
  "domain/service/amazon",
]
expect_min = 3500


# ---- IP ----

[[ruleset]]
name = "ip/cn"
type = "ip"
description = "中国大陆 IP（BGP + 五个 RIR 登记 + DB-IP 地理归属，v4+v6）"
sources = [
  "china46",
  "geo_cn:CN",
  "rir_apnic:CN",
  "rir_arin:CN",
  "rir_ripe:CN",
  "rir_lacnic:CN",
  "rir_afrinic:CN",
]
expect_min = 7600

[[ruleset]]
name = "ip/cn4"
type = "ip"
description = "中国大陆 IPv4（BGP + RIR + 地理归属）"
sources = [
  "china4",
  "geo_cn:CN",
  "rir_apnic:CN",
  "rir_arin:CN",
  "rir_ripe:CN",
  "rir_lacnic:CN",
  "rir_afrinic:CN",
]
family = 4
expect_min = 4300

[[ruleset]]
name = "ip/cn6"
type = "ip"
description = "中国大陆 IPv6（BGP + RIR + 地理归属）"
sources = [
  "china6",
  "geo_cn:CN",
  "rir_apnic:CN",
  "rir_arin:CN",
  "rir_ripe:CN",
  "rir_lacnic:CN",
  "rir_afrinic:CN",
]
family = 6
expect_min = 3200

[[ruleset]]
name = "ip/private"
type = "ip"
description = "特殊用途与组播地址（IANA 特殊用途注册表中 Globally Reachable = False 的条目 + 组播固定段）"
sources = ["iana_v4_special", "iana_v6_special", "iana_multicast"]
expect_min = 15

[[ruleset]]
name = "ip/gfw"
type = "ip"
description = "gfwlist 中以 IP 形式出现的条目（数量很少，保留以求完整）"
sources = ["gfwlist"]
