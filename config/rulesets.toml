###############################################################################
# 输出规则集定义
#
# union 自动拓扑排序；expect_min 为下限保护。
###############################################################################

# ---- 域名 ----

[[ruleset]]
name = "domain/cn"
type = "domain"
description = "中国大陆直连域名（DLC cn + @cn + 国内解析加速表，已扣除 gfw 与隐私探测服务）"
sources = ["dlc:cn", "dlc:*@cn", "china_domain"]
# 被封锁/隐私域名不能进直连集合。
subtract = ["domain/gfw", "domain/privacy"]
expect_min = 62000

[[ruleset]]
name = "domain/gfw"
type = "domain"
description = "GFW 污染的域名（gfwlist，已应用 @@ 白名单）"
sources = ["gfwlist"]
# 通配规则保真为 domain_regex。
allow_regex = true
expect_min = 2500

[[ruleset]]
name = "domain/private"
type = "domain"
description = "内网 / 保留域名"
sources = ["dlc:private", "private_domain"]
expect_min = 20

[[ruleset]]
name = "domain/ads"
type = "domain"
description = "广告域名（等价 geosite:category-ads-all）"
sources = ["dlc:category-ads-all"]
expect_min = 500

[[ruleset]]
name = "domain/non-cn"
type = "domain"
description = "非中国大陆域名（等价 geosite:geolocation-!cn，反选路由用）"
sources = ["dlc:geolocation-!cn"]
expect_min = 15000

