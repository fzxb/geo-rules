###############################################################################
# 上游数据源
#
# 原则：官方/一手优先。IP 归属用 RIR 委派数据（5 个注册机构）与 DB-IP 地理库，
# 实际路由用 BGP 观测数据，服务用厂商自己发布的网络范围。社区列表只用于
# 域名/连通性判断，不参与 IP 归属（gfwlist 的 IP 条目单独进 ip/gfw）。
#
# 字段说明
#   kind         解析器，见 src/geobuild/origins.py
#   url          下载地址，{revision} 会被替换为解析出的 release tag / commit sha
#   url_fallback 主地址不可用时使用的备用地址（{revision} 无法解析或下载失败）
#   repo / ref   用于把构建钉在具体 commit/release 上
#   revision     手动钉死版本，优先级最高
#   expect_min   单次构建最少条目数（源级/规则集级），低于该值视为上游异常并中止
#
# 许可（详见 README "Data sources" 表）：
#   RIR 委派数据 = 各注册机构公开数据（受各自条款约束）；IANA 注册表 = 公开数据
#   iptoasn.com = Public Domain (PDDL v1.0)，可自由再分发
#   DB-IP Lite = CC BY 4.0（需署名）
#   DLC = MIT；gfwlist = LGPL-2.1；gaoyifan = MIT；dnsmasq-china-list = WTFPL v2
#   厂商端点 = 厂商公开数据（受各自条款约束）
###############################################################################

[settings]
# 仓库标识（owner/repo），用于生成 manifest / README 里的链接。
# 留空即自动检测：$GITHUB_REPOSITORY → git remote origin → OWNER/REPO 占位。
repository = ""
# 缓存有效期（秒）；git 源在 revision 未变时复用缓存，不受 TTL 影响
cache_ttl = 21600


# ---------------------------------------------------------------------------
# 域名
# ---------------------------------------------------------------------------

# v2fly/domain-list-community 是 geosite 的事实标准上游（社区维护，非官方认证）。
# include 已展开，属性以规则尾部 `:@attr1,@attr2` 保留，由解析器识别。
[sources.dlc]
kind = "dlc"
repo = "v2fly/domain-list-community"
ref = "latest"
url = "https://github.com/v2fly/domain-list-community/releases/download/{revision}/dlc.dat_plain.yml"
url_fallback = "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat_plain.yml"
expect_min = 1

# 国内 DNS 解析加速表。上游判据是「NS 在中国大陆」或「国内 DNS 解析到大陆 IP」，
# 不是「中国公司/中国服务器」。
# 实测（300 条抽样，阿里 DNS）：有 A 记录的域名中约 80–85% 落在 ip/cn 内（按全部
# 抽样计约 60%），对照组 DLC non-cn 约 0%。因此多数有应答的域名有国内接入点，
# 用于直连判断是合适的近似；但部分条目只有 NS 在国内、服务器在境外，不能保证
# 每条都可直连。它也不等于「中国公司」或「只在中国运营」。
[sources.china_domain]
kind = "dnsmasq_china"
repo = "felixonmars/dnsmasq-china-list"
ref = "master"
url = "https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/{revision}/accelerated-domains.china.conf"
expect_min = 62000

# gfwlist 是 GFW 域名列表的原始项目（AutoProxy 格式）。
[sources.gfwlist]
kind = "gfwlist"
repo = "gfwlist/gfwlist"
ref = "master"
url = "https://raw.githubusercontent.com/gfwlist/gfwlist/{revision}/gfwlist.txt"
expect_min = 2500


