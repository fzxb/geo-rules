# ---------------------------------------------------------------------------
# RIR 委派数据（IP 登记归属，五个注册机构全覆盖）
#
# 注意：登记国家 ≠ IP 实际所在国家。这里作为「登记归属」的权威来源，
# 与上面的 BGP 分类交叉验证。
# ---------------------------------------------------------------------------

[sources.rir_apnic]
kind = "rir"
url = "https://ftp.apnic.net/apnic/stats/apnic/delegated-apnic-latest"
expect_min = 3000

[sources.rir_arin]
kind = "rir"
url = "https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest"
expect_min = 1

[sources.rir_ripe]
kind = "rir"
url = "https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest"
expect_min = 10

[sources.rir_lacnic]
kind = "rir"
url = "https://ftp.lacnic.net/pub/stats/lacnic/delegated-lacnic-latest"
# 该区域没有 CN 登记记录（实测为 0），保留端点以便未来自动纳入
allow_empty = true
expect_min = 1

[sources.rir_afrinic]
kind = "rir"
url = "https://ftp.afrinic.net/pub/stats/afrinic/delegated-afrinic-latest"
# 该区域没有 CN 登记记录（实测为 0），保留端点以便未来自动纳入
allow_empty = true
expect_min = 1


# ---------------------------------------------------------------------------
# 地理位置/使用地（DB-IP Lite，CC BY 4.0）
#
# 与 RIR 登记、BGP 通告互补：登记只说「谁持有」，BGP 只说「有没有路由」，
# 地理库说「实际在哪使用」（含跨国云、CDN、租赁段）。三方取并集。
# 每月发布一个 CSV，文件名带年月；当月文件缺失时回落到上个月（会告警）。
# ---------------------------------------------------------------------------

[sources.geo_cn]
kind = "dbip_country"
url = "https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.csv.gz"
url_fallback = "https://download.db-ip.com/free/dbip-country-lite-{prev_year}-{prev_month}.csv.gz"
expect_min = 9000


# ---------------------------------------------------------------------------
# IANA 特殊用途地址注册表
# 只取 Globally Reachable = False 的条目；父块含可全球访问子块时整体丢弃。
# ---------------------------------------------------------------------------

[sources.iana_v4_special]
kind = "iana_special"
url = "https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry-1.csv"
expect_min = 10

[sources.iana_v6_special]
kind = "iana_special"
url = "https://www.iana.org/assignments/iana-ipv6-special-registry/iana-ipv6-special-registry-1.csv"
expect_min = 5


# ---------------------------------------------------------------------------
# BGP 前缀（ASN → 前缀），iptoasn.com：Public Domain (PDDL v1.0)
# 每小时更新，覆盖完整 BGP 表；用于没有官方 IP 清单的服务。
# ---------------------------------------------------------------------------

# 组播地址段不在 special-purpose 注册表里，单独取自 IANA 组播地址空间注册表：
# IPv4 224.0.0.0/4、IPv6 ff00::/8。只保留这两个聚合块，不引入社区清单。
[sources.iana_multicast]
kind = "static"
entries = ["224.0.0.0/4", "ff00::/8"]
expect_min = 2

[sources.bgp_v4]
kind = "ip2asn"
url = "https://iptoasn.com/data/ip2asn-v4.tsv.gz"
expect_min = 1

[sources.bgp_v6]
kind = "ip2asn"
url = "https://iptoasn.com/data/ip2asn-v6.tsv.gz"
expect_min = 1


# ---------------------------------------------------------------------------
# 服务官方发布的网络范围
# ---------------------------------------------------------------------------

[sources.telegram_ip]
kind = "cidr"
url = "https://core.telegram.org/resources/cidr.txt"
expect_min = 5

[sources.cloudflare_ip]
kind = "cloudflare"
url = "https://api.cloudflare.com/client/v4/ips"
expect_min = 8

# Google 自有服务（含 YouTube / Google Front End）
[sources.google_ip]
kind = "google_ipranges"
url = "https://www.gstatic.com/ipranges/goog.json"
expect_min = 50

# Google Cloud 客户可用范围（goog.json 不含）
[sources.gcloud_ip]
kind = "google_ipranges"
url = "https://www.gstatic.com/ipranges/cloud.json"
expect_min = 50

# AWS 公开范围；aws 文件不保证覆盖全部服务，按 service 过滤后再用
[sources.aws_ip]
kind = "aws_ipranges"
url = "https://ip-ranges.amazonaws.com/ip-ranges.json"
expect_min = 20

# GitHub 官方 meta（web/api/git/pages/packages/hooks/importer/shared_ingress）
[sources.github_ip]
kind = "github_meta"
url = "https://api.github.com/meta"
expect_min = 30


# ---------------------------------------------------------------------------
# 本地固定集合
# ---------------------------------------------------------------------------

# 会暴露客户端真实位置的服务：IP 回显 / 地理查询 / DNS 泄漏检测 / 指纹检测。
# 主清单用 DLC 的 category-ip-geo-detect（一手语义源，约 1,700 条）；
# 这里只补 DLC 没有、但确实会泄漏出口 IP 的站点。
# domain/cn 用 subtract 把它们排除，期望行为是走代理或 reject。
[sources.privacy_domain]
kind = "static"
entries = [
  # DNS / IP 泄漏检测（DLC category-ip-geo-detect 未收录）
  "doileak.com",
  "ipv6-test.com",
  "whatleaks.com",
]

[sources.private_domain]
kind = "static"
entries = [
  "localhost",
  "localdomain",
  "local",
  "lan",
  "home.arpa",
  "in-addr.arpa",
  "ip6.arpa",
]
